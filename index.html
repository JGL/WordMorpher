<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordMorpher</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f1e7;
      }
      canvas {
        display: block;
      }
      #controls {
        position: absolute;
        top: 24px;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        font: 18px Georgia, serif;
        color: #2b2620;
      }
      #controls input,
      #controls button {
        font: inherit;
        color: inherit;
        padding: 6px 10px;
        border: 1px solid #2b2620;
        border-radius: 4px;
        background: #fffdf8;
      }
      #controls input {
        width: 9em;
      }
      #controls button {
        cursor: pointer;
      }
      #controls button:hover {
        background: #2b2620;
        color: #f6f1e7;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/rita@3.2.16/dist/rita.min.js"></script>
    <script src="morpher.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <div id="controls"></div>
  </body>
</html>
